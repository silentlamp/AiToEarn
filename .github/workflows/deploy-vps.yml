name: Deploy VPS (yt.mirailabs.space)

on:
  workflow_dispatch:
    inputs:
      skip_build:
        description: 'Skip image build (pull existing latest)'
        required: false
        type: boolean
        default: false
      image_tag:
        description: 'Image tag to deploy (default: latest)'
        required: false
        type: string
        default: latest
  push:
    branches:
      - main
    paths:
      - 'project/aitoearn-backend/**'
      - 'project/aitoearn-web/**'
      - 'docker-compose.yml'
      - 'docker-compose.prod.yml'
      - 'deploy/**'
      - 'scripts/vps-deploy.sh'
      - 'scripts/validate-prod-config.sh'
      - 'scripts/validate-backend-config-source.sh'
      - '.github/workflows/deploy-vps.yml'
      - '.github/workflows/backend-build.yml'
      - '.github/workflows/web-build.yml'

concurrency:
  group: deploy-vps-aitoearn
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  build-backend:
    if: ${{ github.event_name == 'push' || inputs.skip_build != true }}
    uses: ./.github/workflows/backend-build.yml
    with:
      manual_apps: aitoearn-ai,aitoearn-server
      push_latest: true
    secrets: inherit

  build-web:
    if: ${{ github.event_name == 'push' || inputs.skip_build != true }}
    uses: ./.github/workflows/web-build.yml
    with:
      push_latest: true
    secrets: inherit

  deploy:
    needs: [build-backend, build-web]
    if: |
      !cancelled() &&
      (needs.build-backend.result == 'success' || needs.build-backend.result == 'skipped') &&
      (needs.build-web.result == 'success' || needs.build-web.result == 'skipped') &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.skip_build == true) ||
        (needs.build-backend.result == 'success' && needs.build-web.result == 'success')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.image_tag }}"
          if [ -z "$TAG" ]; then TAG=latest; fi
          echo "image_tag=$TAG" >> $GITHUB_OUTPUT

      - name: Validate deploy configuration
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
          GH_DEPLOY_TOKEN: ${{ secrets.GH_DEPLOY_TOKEN }}
          DOCKER_HUB_USERNAME: ${{ vars.DOCKER_HUB_USERNAME }}
        run: |
          set -euo pipefail
          missing=0
          for name in VPS_HOST VPS_USER VPS_SSH_KEY DOCKER_HUB_TOKEN GH_DEPLOY_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub secret: $name"
              missing=1
            fi
          done
          if [ -z "${DOCKER_HUB_USERNAME:-}" ]; then
            echo "::error::Missing GitHub variable: DOCKER_HUB_USERNAME"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          bash scripts/validate-backend-config-source.sh

      - name: Deploy over SSH
        id: deploy_ssh
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.image_tag }}
          DOCKER_IMAGE_PREFIX: ${{ vars.DOCKER_HUB_USERNAME }}
          DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_DEPLOY_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 120s
          command_timeout: 30m
          envs: IMAGE_TAG,DOCKER_IMAGE_PREFIX,DOCKER_HUB_TOKEN,GH_TOKEN
          script: |
            set -euo pipefail
            export APP_DIR=/home/lain4504/aitoearn
            if [ ! -d "$APP_DIR/.git" ]; then
              echo "ERROR: $APP_DIR not bootstrapped. Run bootstrap first."
              exit 1
            fi
            cd "$APP_DIR"
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/silentlamp/AiToEarn.git"
            sudo /usr/local/sbin/aitoearn-harden-ssh.sh || true
            bash scripts/vps-deploy.sh

      - name: Retry deploy over SSH
        id: deploy_ssh_retry
        if: steps.deploy_ssh.outcome == 'failure'
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.image_tag }}
          DOCKER_IMAGE_PREFIX: ${{ vars.DOCKER_HUB_USERNAME }}
          DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_DEPLOY_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 120s
          command_timeout: 30m
          envs: IMAGE_TAG,DOCKER_IMAGE_PREFIX,DOCKER_HUB_TOKEN,GH_TOKEN
          script: |
            set -euo pipefail
            export APP_DIR=/home/lain4504/aitoearn
            cd "$APP_DIR"
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/silentlamp/AiToEarn.git"
            sudo /usr/local/sbin/aitoearn-harden-ssh.sh || true
            bash scripts/vps-deploy.sh

      - name: Require successful deploy
        if: steps.deploy_ssh.outcome != 'success' && steps.deploy_ssh_retry.outcome != 'success'
        run: |
          echo "Deploy failed. Check VPS logs: docker logs aitoearn-server" >&2
          exit 1

      - name: Smoke check
        run: |
          sleep 5
          curl -fsS --max-time 30 -o /dev/null -w "app:%{http_code}\n" https://yt.mirailabs.space/ || true
          curl -fsS --max-time 30 -o /dev/null -w "health:%{http_code}\n" https://yt.mirailabs.space/api/health || true

      - name: Summary
        run: |
          echo "## Deploy AiToEarn VPS" >> $GITHUB_STEP_SUMMARY
          echo "- App: \`yt.mirailabs.space\`" >> $GITHUB_STEP_SUMMARY
          echo "- Tag: \`${{ steps.tag.outputs.image_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Images: \`${{ vars.DOCKER_HUB_USERNAME }}/aitoearn-{web,server,ai}\`" >> $GITHUB_STEP_SUMMARY
