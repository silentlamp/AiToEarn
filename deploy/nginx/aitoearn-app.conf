# AiToEarn app: yt.mirailabs.space (internal multi-channel ops)
# Upstream: aitoearn-web :3004 | aitoearn-server :3006 | aitoearn-ai :3012

upstream aitoearn_web {
    server 127.0.0.1:3004;
    keepalive 32;
}

upstream aitoearn_server {
    server 127.0.0.1:3006;
    keepalive 32;
}

upstream aitoearn_ai {
    server 127.0.0.1:3012;
    keepalive 32;
}

upstream aitoearn_oss {
    server 127.0.0.1:19000;
    keepalive 16;
}

server {
    server_name yt.mirailabs.space;

    client_max_body_size 500M;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 86400s;
    proxy_send_timeout 60s;

    location /api/ai/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://aitoearn_ai;
    }

    location /api/agent/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://aitoearn_ai;
    }

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://aitoearn_server;
    }

    location /oss/ {
        proxy_pass http://aitoearn_oss/aitoearn/;

        add_header 'Access-Control-Allow-Origin' '$http_origin' always;
        add_header 'Access-Control-Allow-Methods' 'GET, PUT, POST, HEAD, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Content-Length' always;
        add_header 'Access-Control-Expose-Headers' 'ETag' always;

        if ($request_method = OPTIONS) {
            add_header 'Access-Control-Allow-Origin' '$http_origin' always;
            add_header 'Access-Control-Allow-Methods' 'GET, PUT, POST, HEAD, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Content-Length' always;
            add_header 'Access-Control-Max-Age' 86400;
            add_header 'Content-Length' 0;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            return 204;
        }
    }

    location /aitoearn/ {
        proxy_pass http://aitoearn_oss/aitoearn/;

        add_header 'Access-Control-Allow-Origin' '$http_origin' always;
        add_header 'Access-Control-Allow-Methods' 'GET, PUT, POST, HEAD, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Content-Length, Authorization, x-amz-*' always;
        add_header 'Access-Control-Expose-Headers' 'ETag' always;

        if ($request_method = OPTIONS) {
            add_header 'Access-Control-Allow-Origin' '$http_origin' always;
            add_header 'Access-Control-Allow-Methods' 'GET, PUT, POST, HEAD, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Content-Length, Authorization, x-amz-*' always;
            add_header 'Access-Control-Max-Age' 86400;
            add_header 'Content-Length' 0;
            return 204;
        }
    }

    location / {
        proxy_pass http://aitoearn_web;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/yt.mirailabs.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yt.mirailabs.space/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name yt.mirailabs.space;
    return 301 https://$host$request_uri;
}
